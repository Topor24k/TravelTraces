name: travelplaces

services:
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      APP_ENV: production
      API_CORS_ORIGINS: http://localhost:8080
      OSRM_URL: https://router.project-osrm.org
      NOMINATIM_URL: https://nominatim.openstreetmap.org
      PHOTON_URL: https://photon.komoot.io
      REGION_HINT: Philippines
      MAX_REQUEST_BYTES: 1048576
      CHAT_MODEL_URL: ${CHAT_MODEL_URL:-}
      CHAT_MODEL_API_KEY: ${CHAT_MODEL_API_KEY:-}
      CHAT_MODEL_TIMEOUT_S: ${CHAT_MODEL_TIMEOUT_S:-60}
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    cpus: 0.75
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: backend/docker/frontend.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    cpus: 0.50
    networks:
      - edge
      - internal

networks:
  edge:
  internal:
    internal: true
